name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm config set @buf:registry https://buf.build/gen/npm/v1/
      - run: npm ci --legacy-peer-deps
      - run: npm run ts:check
